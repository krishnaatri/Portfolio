<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Game</title>
    <link rel="stylesheet" href="project3.css">
</head>

<body>

    <div class="game">

        <!-- Top bar: three boxes in a row -->
        <div class="hud">
            <div class="hud-box">Player: Krishna</div>
            <div class="hud-box">Level: 1</div>
            <div class="hud-box">Score: 0</div>
        </div>

        <h1 class="title">Choose Your Hero</h1>

        <!-- Row of hero cards -->
        <div class="heroes">

            <div class="hero hero-blue">
                <div class="hero-icon">🧙</div>
                <p class="hero-name">Wizard</p>
                <p class="hero-stat">Power: 9</p>
            </div>

            <div class="hero hero-red">
                <div class="hero-icon">🛡️</div>
                <p class="hero-name">Knight</p>
                <p class="hero-stat">Defense: 9</p>
            </div>

            <div class="hero hero-green">
                <div class="hero-icon">🏹</div>
                <p class="hero-name">Archer</p>
                <p class="hero-stat">Speed: 9</p>
            </div>

        </div>

        <!-- Bottom buttons -->
        <div class="controls">
            <button class="btn">Start Game</button>
            <button class="btn">How to Play</button>
        </div>

    </div>

</body>
</html>
